[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-nexus-ping-keys"
version = "13.9.0"
description = "Gemini Nexus DB - Google Gemini and Gemma API key orchestrator, multi-threaded pinger, and stream splitter"
readme = "AGENTS.md"
requires-python = ">=3.10"
authors = [
    { name = "NeuroStarNet" }
]
dependencies = [
    "customtkinter>=5.2.0",
    "PySocks>=1.7.1",
]

[project.scripts]
ping-keys = "ping_keys_NeuroStarNet_v13_9:main"

[tool.ruff]
line-length = 120
target-version = "py310"
