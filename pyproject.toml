[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-nexus-ping-keys"
version = "14.0.0"
description = "Gemini Nexus DB - Google Gemini and Gemma API key orchestrator, multi-threaded pinger, and stream splitter"
readme = "AGENTS.md"
requires-python = ">=3.10"
authors = [
    { name = "NeuroStarNet" }
]
dependencies = [
    "PyQt6>=6.6.0",
    "pyqtdarktheme>=2.1.0",
    "PySocks>=1.7.1",
]

[project.scripts]
ping-keys = "gemini_nexus.main:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
